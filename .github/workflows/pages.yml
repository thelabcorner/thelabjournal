name: Deploy Journal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate archive sorting
        run: bun run audit:archive
      - name: Validate brand icon assets
        run: bun run audit:icons
      - name: Build site and render every article OG image with Satori
        run: bun run build
        env:
          GITHUB_PAGES: 'true'
      - name: Audit homepage and per-article social media previews
        run: bun run audit:og
      - name: Audit article route links
        run: bun scripts/article-route-audit.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4