name: Deploy Journal to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # Enable only after the scoped Cloudflare GitHub secrets are installed.
    # GitHub Pages remains a separate legacy deployment in pages.yml.
    if: vars.JOURNAL_CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: journal-production
      url: https://journal.thedabcorner.site/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production root-domain assets
        run: bun run build
        env:
          GITHUB_PAGES: 'false'
      - name: Verify release headers are packaged
        run: |
          test -f dist/_headers
          grep -q 'Cache-Control: no-store, max-age=0' dist/_headers
          test -f dist/sw.js
      - name: Deploy to journal.thedabcorner.site
        run: bunx wrangler deploy --config wrangler.jsonc
      - name: Verify the deployed release
        run: bun scripts/pwa-deployment-audit.mjs