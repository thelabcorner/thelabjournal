<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="thelabjournal™" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png?v=2" />
  <script>
    (() => {
      let preference = 'system';
      try {
        const data = JSON.parse(localStorage.getItem('thelabcorner.journal.preferences.v2') || '{}');
        if (data.theme === 'dark' || data.theme === 'light') preference = data.theme;
      } catch {}
      const theme = preference === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111113' : '#fafafa';
    })();
  </script>
  <!-- First paint is destination-aware, even before React/Workbox finishes
       fetching application modules. No network request or font is required. -->
  <style>
    .journal-boot{position:relative;width:min(100%,620px);margin:clamp(72px,12vh,136px) auto;padding:0 24px 36px;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Inter",sans-serif;color:#18181b;opacity:0;animation:journal-boot-in .12s ease-out .18s both}
    [data-theme="dark"] .journal-boot{color:#fafafa}
    .journal-boot-dots{display:grid;grid-template-columns:repeat(2,5px);gap:4px;width:max-content;margin-bottom:25px}
    .journal-boot-dots i{width:5px;height:5px;background:currentColor;opacity:.25;animation:journal-boot-pulse 1.15s steps(2,end) infinite}
    .journal-boot-dots i:nth-child(2){animation-delay:.18s}.journal-boot-dots i:nth-child(3){animation-delay:.36s}.journal-boot-dots i:nth-child(4){animation-delay:.54s}
    .journal-boot-label{font-size:11px;font-weight:550;color:inherit;opacity:.65}
    .journal-boot h1{margin:14px 0 12px;font-size:clamp(23px,4vw,30px);line-height:1.18;font-weight:600;letter-spacing:-.035em}
    .journal-boot p{margin:0;font-size:13px;opacity:.65;max-width:55ch}
    @keyframes journal-boot-in{to{opacity:1}}@keyframes journal-boot-pulse{50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.journal-boot{animation:none;opacity:1}.journal-boot-dots i{animation:none;opacity:.65}}
  </style>
  <meta name="description" content="thelabjournal™: independent scientific research, engineering notes, and experimental work." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="thelabjournal™" />
  <meta property="og:url" content="https://journal.thedabcorner.site/" />
  <meta property="og:title" content="thelabjournal™" />
  <meta property="og:description" content="Independent research, engineering notes, and essays from the workbench." />
  <meta property="og:image" content="https://journal.thedabcorner.site/og-image.png?v=1" />
  <meta property="og:image:secure_url" content="https://journal.thedabcorner.site/og-image.png?v=1" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="thelabjournal™ — Independent research, engineering notes, and essays from the workbench. A grayscale Inter wordmark over a restrained dithered technical sphere." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="thelabjournal™" />
  <meta name="twitter:description" content="Independent research, engineering notes, and essays from the workbench." />
  <meta name="twitter:image" content="https://journal.thedabcorner.site/og-image.png?v=1" />
  <meta name="twitter:img:src" content="https://journal.thedabcorner.site/og-image.png?v=1" />

  <title>thelabjournal™</title>
  <link rel="icon" type="image/x-icon" sizes="any" href="%BASE_URL%favicon.ico?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png?v=2" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=2" />
</head>
<body>
  <div id="root"></div>
  <script>
    (() => {
      // A direct article/manuscript link must never display a false homepage
      // during a slow initial script download or a PWA-controlled navigation.
      const prefix = '%BASE_URL%'.replace(/\/$/, '');
      const path = location.pathname.startsWith(prefix + '/')
        ? location.pathname.slice(prefix.length) : location.pathname;
      const title = /^\/posts\/[^/]+\/?$/.test(path) || new URLSearchParams(location.search).has('post') ? 'Opening article…'
        : /^\/research\/[^/]+\/?$/.test(path) ? 'Opening manuscript…'
        : /^\/research\/?$/.test(path) ? 'Opening manuscripts…'
        : /^\/quotes\/collections\/[^/]+\/?$/.test(path) ? 'Opening collection…'
        : /^\/quotes\/[^/]+\/?$/.test(path) ? 'Opening quotation…'
        : /^\/quotes\/?$/.test(path) ? 'Opening quotations…'
        : 'Opening journal…';
      const root = document.getElementById('root');
      const boot = document.createElement('main');
      boot.className = 'journal-boot';
      boot.id = 'journal-boot';
      boot.setAttribute('role', 'status');
      boot.setAttribute('aria-label', 'Preparing journal');
      boot.innerHTML = '<span class="journal-boot-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="journal-boot-label">The Lab Journal</span><h1></h1><p>Preparing your reading experience.</p>';
      boot.querySelector('h1').textContent = title;
      root.appendChild(boot);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
