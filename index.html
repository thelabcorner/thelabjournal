<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="thelabjournal™" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png?v=2" />
  <script>
    (() => {
      let preference = 'system';
      try {
        const data = JSON.parse(localStorage.getItem('thelabcorner.journal.preferences.v2') || '{}');
        if (data.theme === 'dark' || data.theme === 'light') preference = data.theme;
      } catch {}
      const theme = preference === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111113' : '#fafafa';
    })();
  </script>
  <meta name="description" content="thelabjournal™: independent scientific research, engineering notes, and experimental work." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="thelabjournal™" />
  <meta property="og:url" content="https://thelabcorner.github.io/thelabjournal/" />
  <meta property="og:title" content="thelabjournal™" />
  <meta property="og:description" content="Independent research, engineering notes, and essays from the workbench." />
