<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenFork — Interconnected systems</title><style>
:root{color-scheme:light dark;--bg:#fafafa;--panel:#f4f4f5;--ink:#18181b;--quiet:#52525b;--rule:#b6b6bc}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--panel:#18181b;--ink:#fafafa;--quiet:#b4b4bd;--rule:#62626b}}
html,body{padding:0;margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
svg{display:block;width:100%;height:100%}
.paper{fill:var(--bg)}.panel{fill:var(--panel)}.ink{fill:var(--ink)}.quiet{fill:var(--quiet)}.hair{stroke:var(--rule);stroke-width:1;fill:none}.route{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round}
.tag{font-weight:650;letter-spacing:1.2px}.label{font-weight:680;letter-spacing:-.1px}.micro{letter-spacing:.4px}
</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">OpenFork interconnection map, desktop</title><desc id="desc">A five-row integration topology: each row has separate straight incoming arrows from ChatGPT via OXP and from a native OpenFork Session. Delegation creates workers; OFXP accesses a separate host.</desc>

<text x="40" y="34" font-size="12" class="quiet tag">FIG. 01   /   SYSTEMS INTEGRATION</text>
<text x="1240" y="34" font-size="11" class="quiet tag" text-anchor="end">DESKTOP   ·   16:9</text>
<path d="M40 48H1240" class="hair"/>
<text x="40" y="84" font-size="26" class="ink label">OpenFork connects systems into shared capabilities.</text>
<text x="40" y="112" font-size="14" class="quiet">OpenCode is the harness foundation. Each row identifies two separately authorized entry routes.</text>

<rect x="40" y="210" width="1200" height="65" rx="3" class="paper" stroke="var(--rule)" stroke-width="1"/>
<text x="58" y="234" font-size="12" class="quiet tag">01</text>
<text x="58" y="256" font-size="13" class="ink label">CALL</text>
<text x="1222" y="256" font-size="13" class="ink label" text-anchor="end">CALL</text>

<path d="M1104 243 H864" class="route" marker-end="url(#arrow-left)"/>

<path d="M40 609H1240" class="hair"/>
<text x="40" y="638" font-size="11" class="quiet tag">DELEGATE</text>
