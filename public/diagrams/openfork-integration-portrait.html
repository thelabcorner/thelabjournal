<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenFork — Interconnected systems</title><style>
:root{color-scheme:light dark;--bg:#fafafa;--panel:#f4f4f5;--ink:#18181b;--quiet:#52525b;--rule:#b6b6bc}
